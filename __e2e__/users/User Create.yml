info:
  name: User Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{local}}/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "{{$randomFirstName}}",
        "lastName": "{{$randomLastName}}",
        "email": "{{$randomEmail}}",
        "password": "{{$randomPassword}}",
        "role": "GUEST",
        "employee":{
          "code": "{{$randomUUID}}",
          "position":"{{$randomBoolean}}",
          "phoneNumber":"{{$randomPhoneNumber}}",
          "hireDate":"{{$randomDateRecent}}"
        }
      }
  auth:
    type: bearer
    token: "{{jwt}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Created — User Created
    request:
      url: "{{local}}/users"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "email": "{{$randomEmail}}",
            "password": "{{$randomPassword}}",
            "role": "GUEST",
            "employee":{
              "code": "{{$randomUUID}}",
              "position":"{{$randomBoolean}}",
              "phoneNumber":"{{$randomPhoneNumber}}",
              "hireDate":"{{$randomDateRecent}}"
            }
          }
    response:
      statusText: "201"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "uid": 42,
            "firstName": "John",
            "lastName": "Doe",
            "email": "john.doe@example.com",
            "role": "GUEST",
            "abilities": [],
            "createdAt": "2024-01-15T10:30:00.000Z",
            "updatedAt": "2024-01-15T10:30:00.000Z"
          }
  - name: 400 Bad Request — Validation Error
    request:
      url: "{{local}}/users"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "email": "{{$randomEmail}}",
            "password": "{{$randomPassword}}",
            "role": "GUEST",
            "employee":{
              "code": "{{$randomUUID}}",
              "position":"{{$randomBoolean}}",
              "phoneNumber":"{{$randomPhoneNumber}}",
              "hireDate":"{{$randomDateRecent}}"
            }
          }
    response:
      statusText: "400"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "message": [
              "First name must not be empty",
              "email must be an email",
              "Password must be at least 8 characters long"
            ],
            "error": "Bad Request"
          }
  - name: 403 Forbidden — Insufficient Permissions
    request:
      url: "{{local}}/users"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "email": "{{$randomEmail}}",
            "password": "{{$randomPassword}}",
            "role": "GUEST",
            "employee":{
              "code": "{{$randomUUID}}",
              "position":"{{$randomBoolean}}",
              "phoneNumber":"{{$randomPhoneNumber}}",
              "hireDate":"{{$randomDateRecent}}"
            }
          }
    response:
      statusText: "403"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 403,
            "message": "Forbidden resource",
            "error": "Forbidden"
          }

docs: |-
  Creates a new user.

  **Access:** Requires role `ADMIN` and ability `TENANT_MOD`.

  **Validation rules:**
  - `firstName` — required, non-empty
  - `lastName` — required, non-empty
  - `email` — required, valid email format
  - `password` — required, minimum 8 characters
  - `role` — optional enum: `ADMIN` | `USER` | `GUEST` (defaults to `GUEST`)

  **Errors:**
  - `400 Bad Request` — validation failed
  - `403 Forbidden` — insufficient role or abilities
