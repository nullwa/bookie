info:
  name: User Get By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{local}}/users/8"
  auth:
    type: bearer
    token: "{{jwt}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK — User Found
    request:
      url: "{{local}}/users/8"
      method: GET
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "uid": 42,
            "firstName": "John",
            "lastName": "Doe",
            "email": "john.doe@example.com",
            "role": "GUEST",
            "abilities": [],
            "createdAt": "2024-01-15T10:30:00.000Z",
            "updatedAt": "2024-01-15T10:30:00.000Z"
          }
  - name: 404 Not Found
    request:
      url: "{{local}}/users/8"
      method: GET
    response:
      statusText: "404"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 404,
            "message": "User with id 42 not found",
            "error": "Not Found"
          }

docs: |-
  Retrieves a single user by their numeric unique identifier (`uid`).

  **Path parameter:**
  - `:id` — numeric user UID

  **Errors:**
  - `404 Not Found` — no user exists with the given id
