info:
  name: User Get All
  type: http
  seq: 2

http:
  method: GET
  url: "{{local}}/users?page=1&limit=30&search=email:.com,firstName:p&fields=firstName,lastName,email"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "30"
      type: query
    - name: sort
      value: firstName:ASC
      type: query
      disabled: true
    - name: search
      value: email:.com,firstName:p
      type: query
    - name: fields
      value: firstName,lastName,email
      type: query
      description: Comma-separated fields to include in response
    - name: include
      value: reservation
      type: query
      description: Comma-separated relations to left-join and return
      disabled: true
  auth:
    type: bearer
    token: "{{jwt}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK — Paginated Users
    request:
      url: "{{local}}/users?page=1&limit=30&search=email:.com,firstName:p&fields=firstName,lastName,email"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "30"
          type: query
        - name: sort
          value: firstName:ASC
          type: query
          disabled: true
        - name: search
          value: email:.com,firstName:p
          type: query
        - name: fields
          value: firstName,lastName,email
          type: query
          description: Comma-separated fields to include in response
        - name: include
          value: reservation
          type: query
          description: Comma-separated relations to left-join and return
          disabled: true
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "uid": 42,
                "firstName": "John",
                "lastName": "Doe",
                "email": "john.doe@example.com",
                "role": "GUEST",
                "abilities": [],
                "createdAt": "2024-01-15T10:30:00.000Z",
                "updatedAt": "2024-01-15T10:30:00.000Z"
              },
              {
                "uid": 43,
                "firstName": "Jane",
                "lastName": "Doe",
                "email": "jane.doe@example.com",
                "role": "ADMIN",
                "abilities": ["TENANT_MOD"],
                "createdAt": "2024-01-14T08:00:00.000Z",
                "updatedAt": "2024-01-14T08:00:00.000Z"
              }
            ],
            "meta": {
              "page": 1,
              "limit": 25,
              "total": 2,
              "totalPages": 1
            }
          }
  - name: 200 OK — Fields Selection Example
    request:
      url: "{{local}}/users?page=1&limit=30&search=email:.com,firstName:p&fields=firstName,lastName,email"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "30"
          type: query
        - name: sort
          value: firstName:ASC
          type: query
          disabled: true
        - name: search
          value: email:.com,firstName:p
          type: query
        - name: fields
          value: firstName,lastName,email
          type: query
          description: Comma-separated fields to include in response
        - name: include
          value: reservation
          type: query
          description: Comma-separated relations to left-join and return
          disabled: true
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "firstName": "John",
                "lastName": "Doe",
                "email": "john.doe@example.com"
              }
            ],
            "meta": {
              "page": 1,
              "limit": 25,
              "total": 1,
              "totalPages": 1
            }
          }

docs: |-
  Returns a paginated list of users with optional filtering, sorting, field selection, and relation inclusion.

  **Query parameters:**

  | Param | Type | Default | Description |
  |-------|------|---------|-------------|
  | `page` | number | `1` | Page number (min 1) |
  | `limit` | number | `25` | Items per page (min 10) |
  | `sort` | enum | `desc` | Default sort direction: `asc` \| `desc` |
  | `orderBy` | string | — | Field-level sort: `field:ASC,field:DESC` |
  | `search` | string | — | ILIKE search across string fields |
  | `fields` | string | — | Comma-separated fields to return |
  | `include` | string | — | Comma-separated relations to eager-load |

  **Example — advanced query:**
  ```
  GET /users?page=2&limit=10&sort=asc&orderBy=lastName:ASC&search=doe&fields=firstName,lastName,email&include=posts
  ```
