info:
  name: User Update
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{local}}/users/12"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "{{$randomFirstName}}",
        "lastName": "{{$randomLastName}}",
        "role": "CLIENT",
        "abilities": ["TENANT_MOD"]
      }
  auth:
    type: bearer
    token: "{{jwt}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK — User Updated
    request:
      url: "{{local}}/users/12"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "role": "CLIENT",
            "abilities": ["TENANT_MOD"]
          }
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "uid": 42,
            "firstName": "Johnathan",
            "lastName": "Doe",
            "email": "john.doe@example.com",
            "role": "USER",
            "abilities": ["TENANT_MOD"],
            "createdAt": "2024-01-15T10:30:00.000Z",
            "updatedAt": "2024-01-15T11:00:00.000Z"
          }
  - name: 400 Bad Request — Validation Error
    request:
      url: "{{local}}/users/12"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "role": "CLIENT",
            "abilities": ["TENANT_MOD"]
          }
    response:
      statusText: "400"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 400,
            "message": [
              "this ability is not valid"
            ],
            "error": "Bad Request"
          }
  - name: 404 Not Found
    request:
      url: "{{local}}/users/12"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "role": "CLIENT",
            "abilities": ["TENANT_MOD"]
          }
    response:
      statusText: "404"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 404,
            "message": "User with id 42 not found",
            "error": "Not Found"
          }

docs: |-
  Partially updates an existing user. All fields from `UserCreateDto` are optional, plus the `abilities` array.

  **Path parameter:**
  - `:id` — numeric user UID

  **Updatable fields (all optional):**
  - `firstName` — string
  - `lastName` — string
  - `email` — valid email
  - `password` — min 8 characters
  - `role` — enum: `ADMIN` | `USER` | `GUEST`
  - `abilities` — array of ability enums (e.g. `["TENANT_MOD"]`)

  **Errors:**
  - `400 Bad Request` — validation failed on provided fields
  - `404 Not Found` — user does not exist
