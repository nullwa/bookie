info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: '{{url}}/auth/register'
  body:
    type: json
    data: |-
      {
        "email": "test@email.com",
        "password": "azerty1234",
        "firstName": "super",
        "lastName": "super"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
