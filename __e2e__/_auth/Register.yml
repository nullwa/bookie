info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{local}}/auth/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "firstName": "{{$randomFirstName}}",
        "lastName": "{{$randomLastName}}",
        "email": "{{$randomEmail}}",
        "password": "{{$randomPassword}}",
        "role": "CLIENT"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 201) {\r

        \  const json = res.getBody();\r

        \  bru.setEnvVar('jwt', json.token);\r

        \  bru.setEnvVar('jwt refresh', json.refreshToken);\r

        \  console.log('JWT token saved to collection variable: jwtToken');\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Created — Successful Registration
    request:
      url: "{{local}}/auth/register"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "email": "{{$randomEmail}}",
            "password": "{{$randomPassword}}",
            "role": "CLIENT"
          }
    response:
      statusText: "201"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLXVpZC00NTYiLCJlbWFpbCI6ImphbmUuZG9lQGV4YW1wbGUuY29tIiwicm9sZSI6InVzZXIiLCJhYmlsaXRpZXMiOltdLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MTcwMDAwMzYwMH0.signature"
          }
  - name: 401 Unauthorized — Registration Failed
    request:
      url: "{{local}}/auth/register"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "firstName": "{{$randomFirstName}}",
            "lastName": "{{$randomLastName}}",
            "email": "{{$randomEmail}}",
            "password": "{{$randomPassword}}",
            "role": "CLIENT"
          }
    response:
      statusText: "401"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 401,
            "message": "Registration failed: unable to create user",
            "error": "Unauthorized"
          }

docs: |-
  Registers a new user and immediately authenticates them. Returns a signed JWT token upon successful registration.

  **Access:** Public (no authentication required)

  **On success:** The test script automatically saves the returned token to the `jwtToken` collection variable.

  **Errors:**
  - `401 Unauthorized` — Unable to create user (e.g. email already in use)
