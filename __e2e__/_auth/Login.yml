info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{local}}/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "Tess.Maggio84@yahoo.com",
        "password": "1234567890"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 201) {\r

        \  const json = res.getBody();\r

        \  bru.setEnvVar('jwt', json.token);\r

        \  bru.setEnvVar('jwt refresh', json.refreshToken)\r

        \  console.log('JWT token saved to collection variable: jwtToken');\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK — Successful Login
    request:
      url: http://
      method: POST
      body:
        type: text
        data: |-
          {
            "email": "john.doe@example.com",
            "password": "SecurePassword123!"
          }
    response:
      statusText: "200"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLXVpZC0xMjMiLCJlbWFpbCI6ImpvaG4uZG9lQGV4YW1wbGUuY29tIiwicm9sZSI6InVzZXIiLCJhYmlsaXRpZXMiOltdLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MTcwMDAwMzYwMH0.signature"
          }
  - name: 401 Unauthorized — User Not Found
    request:
      url: http://
      method: POST
      body:
        type: text
        data: |-
          {
            "email": "nonexistent@example.com",
            "password": "SomePassword123!"
          }
    response:
      statusText: "401"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 401,
            "message": "Invalid credentials: user not found",
            "error": "Unauthorized"
          }
  - name: 401 Unauthorized — Wrong Password
    request:
      url: http://
      method: POST
      body:
        type: text
        data: |-
          {
            "email": "john.doe@example.com",
            "password": "WrongPassword!"
          }
    response:
      statusText: "401"
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "statusCode": 401,
            "message": "Invalid credentials: password does not match",
            "error": "Unauthorized"
          }

docs: |-
  Authenticates a user with their email and password. Returns a signed JWT token that can be used to access protected endpoints.

  **Access:** Public (no authentication required)

  **On success:** The test script automatically saves the returned token to the `jwtToken` collection variable.

  **Errors:**
  - `401 Unauthorized` — User not found or password does not match
