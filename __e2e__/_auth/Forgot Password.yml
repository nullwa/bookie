docs: |-
  ## Forgot Password

  Initiates the **forgot password** flow for a registered user. This endpoint accepts the user's email address and triggers a password reset process (e.g., sends a reset link or OTP to the provided email).

  ---

  ### Request Details

  | Property | Value |
  | --- | --- |
  | **Method** | `POST` |
  | **URL** | `{{local}}/auth/forgot-password` |
  | **Content-Type** | `application/json` |

  ---

  ### Request Body

  | Field | Type | Required | Description |
  | --- | --- | --- | --- |
  | `email` | `string` | ✅ Yes | The email address associated with the user's account. |

  **Example:**

  ``` json
  {
    "email": "wala@tribe.com"
  }

   ```

  ---

  ### Expected Behavior

  - If the email exists in the system, a password reset email (or token) is sent to the provided address.
      
  - If the email does not exist, the API may return a `404 Not Found` or a generic success message (to avoid user enumeration).
      
  - On success, the response typically returns a `200 OK` with a confirmation message.
